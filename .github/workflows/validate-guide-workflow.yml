name: Validate guide workflow

on:
  push:
    paths:
      - '.agents/shared-agents.lock.json'
      - '.agents/site-context.md'
      - '.agents/skills/**'
      - 'scripts/sync_shared_agents.py'
      - 'validate_guide_quality.py'
      - 'AGENTS.md'
      - '.agents/workflows/guide-analysis.md'
      - '.agents/workflows/guide-content.md'
      - '.agents/workflows/guides.md'
      - '.content/briefs/**'
      - '.content/guides/**'
      - 'assets/guide-content.css'
      - 'gidsen/**'
      - 'scripts/build-preserving-guides.mjs'
      - 'scripts/sync_guide_skills.py'
      - 'scripts/check_guides.mjs'
      - '.github/workflows/validate-guide-workflow.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.agents/shared-agents.lock.json'
      - '.agents/site-context.md'
      - '.agents/skills/**'
      - 'scripts/sync_shared_agents.py'
      - 'validate_guide_quality.py'
      - 'AGENTS.md'
      - '.agents/workflows/guide-analysis.md'
      - '.agents/workflows/guide-content.md'
      - '.agents/workflows/guides.md'
      - '.content/briefs/**'
      - '.content/guides/**'
      - 'assets/guide-content.css'
      - 'gidsen/**'
      - 'scripts/build-preserving-guides.mjs'
      - 'scripts/sync_guide_skills.py'
      - 'scripts/check_guides.mjs'
      - '.github/workflows/validate-guide-workflow.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  validate-guide-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Read pinned shared-agent reference
        id: agent-ref
        run: echo "sha=$(python -c 'import json; print(json.load(open(".agents/shared-agents.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Checkout the original agent files
        uses: actions/checkout@v4
        with:
          repository: MarcW88/bloc-notes-numerique
          ref: ${{ steps.agent-ref.outputs.sha }}
          path: .agent-reference
          sparse-checkout: .agents/skills
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify exact shared-agent bytes
        run: python scripts/sync_shared_agents.py --source .agent-reference --check

      - name: Run the shared workflow's site command adapter
        run: python validate_guide_quality.py

      - name: Validate guide HTML structure before build
        run: node scripts/check_guides.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Build site without mutating authored guides
        run: npm run build

      - name: Validate guide HTML structure after build
        run: node scripts/check_guides.mjs
