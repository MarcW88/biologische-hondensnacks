name: Validate guide workflow

on:
  push:
    paths:
      - '.agents/guide-skills.lock.json'
      - '.agents/workflows/guide-analysis.md'
      - '.agents/workflows/guide-content.md'
      - '.agents/workflows/guides.md'
      - '.content/briefs/**'
      - '.content/guides/**'
      - 'assets/guide-content.css'
      - 'gidsen/**'
      - 'scripts/build-preserving-guides.mjs'
      - 'scripts/sync_guide_skills.py'
      - 'scripts/check_guides.mjs'
      - '.github/workflows/validate-guide-workflow.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.agents/guide-skills.lock.json'
      - '.agents/workflows/guide-analysis.md'
      - '.agents/workflows/guide-content.md'
      - '.agents/workflows/guides.md'
      - '.content/briefs/**'
      - '.content/guides/**'
      - 'assets/guide-content.css'
      - 'gidsen/**'
      - 'scripts/build-preserving-guides.mjs'
      - 'scripts/sync_guide_skills.py'
      - 'scripts/check_guides.mjs'
      - '.github/workflows/validate-guide-workflow.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  validate-guide-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify and materialize pinned upstream skills
        run: python scripts/sync_guide_skills.py --sync --remote

      - name: Validate guide HTML structure before build
        run: node scripts/check_guides.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Build site without mutating authored guides
        run: npm run build

      - name: Validate guide HTML structure after build
        run: node scripts/check_guides.mjs
