name: Visual design review
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate approved editorial images with BFL"]
    types: [completed]
  pull_request:
    paths: ['**/*.html', 'assets/**', 'scripts/**', '.agents/skills/site-design-review/**', 'package*.json', '.github/workflows/visual-design-review.yml']
  push:
    branches: [main]
    paths: ['**/*.html', 'assets/**', 'scripts/**', '.agents/skills/site-design-review/**', 'package*.json', '.github/workflows/visual-design-review.yml']
permissions:
  contents: read
jobs:
  visual-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - run: npm run visual:install
      - run: npm run check
      - run: node scripts/check_guides.mjs
      - run: npm run check:snacks
      - run: npm run test:design
      - run: npm run visual:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-design-review
          path: |
            .artifacts/design-review/
            .artifacts/design-tests.json
          retention-days: 14
