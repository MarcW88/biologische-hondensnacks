name: Guide publish readiness

on:
  workflow_dispatch:
    inputs:
      publish_gate:
        description: 'Fail when placeholder guide content is still present'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  guide-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify and materialize pinned upstream guide skills
        run: python scripts/sync_guide_skills.py --sync --remote

      - name: Validate guide pages
        if: ${{ !inputs.publish_gate }}
        run: node scripts/check_guides.mjs

      - name: Validate guide pages for publication
        if: ${{ inputs.publish_gate }}
        run: node scripts/check_guides.mjs --publish

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Show provenance lock
        run: python scripts/sync_guide_skills.py
