name: Materialize navigation into source HTML
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-navigation.yml'
      - 'scripts/sync-navigation.mjs'
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/check_guides.mjs
      - run: npm run check
      - name: Commit materialized HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
          else
            git commit -m "build: materialize shared navigation in HTML"
            git push origin HEAD:main
          fi
