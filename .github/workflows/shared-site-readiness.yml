name: Shared site machine readiness
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_agent_installation.py
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python validate_guide_quality.py
      - run: python .agents/skills/anti-ai-slop/tools/validators/check_all.py --root .agents/skills/anti-ai-slop --profile pack-self --format markdown
