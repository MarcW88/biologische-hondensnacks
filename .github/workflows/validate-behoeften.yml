name: Validate Behoeften editorial pages
on:
  push:
    paths:
      - 'voor-gevoelige-honden/**'
      - '.content/behoeften/**'
      - '.agents/workflows/behoeften-*.md'
      - 'behoeften-workflow.config.yaml'
      - 'scripts/check_behoeften.mjs'
      - 'scripts/validate_behoeften_run.mjs'
      - '.agents/skills/behoeften-*/**'
      - '.content/behoeften/runs/**'
      - 'scripts/apply_behoeften_content.mjs'
      - 'scripts/build-preserving-guides.mjs'
      - '.github/workflows/validate-behoeften.yml'
  pull_request:
    paths:
      - 'voor-gevoelige-honden/**'
      - '.content/behoeften/**'
      - '.agents/workflows/behoeften-*.md'
      - 'behoeften-workflow.config.yaml'
      - 'scripts/check_behoeften.mjs'
      - 'scripts/validate_behoeften_run.mjs'
      - '.agents/skills/behoeften-*/**'
      - '.content/behoeften/runs/**'
      - 'scripts/build-preserving-guides.mjs'
      - '.github/workflows/validate-behoeften.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Behoeften structure and draft indexation
        run: node scripts/check_behoeften.mjs
      - name: Verify authored content matches reviewed source
        run: node scripts/apply_behoeften_content.mjs --check
      - name: Verify editorial run evidence
        run: node scripts/validate_behoeften_run.mjs
      - name: Check project HTML
        run: npm run check
